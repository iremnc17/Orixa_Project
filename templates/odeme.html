<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orixa - Güvenli Ödeme Sayfası</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; }
        
        .checkout-container {
            max-width: 900px; margin: 150px auto 50px; padding: 40px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; position: relative; z-index: 2;
        }

        .order-summary, .payment-form-container { width: 100%; }
        
        h2 { font-size: 1.5rem; margin-bottom: 20px; color: var(--text-main); }
        
        .cart-item { 
            display: flex; justify-content: space-between; padding: 15px 0;
            border-bottom: 1px solid var(--border-color); 
        }

        .total-price-box { 
            margin-top: 20px; font-size: 1.2rem; font-weight: bold;
            display: flex; justify-content: space-between; color: var(--neon-blue);
        }

        .izco-badge { 
            background: rgba(137, 87, 229, 0.15); color: var(--primary-purple);
            padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 0.9rem; }
        
        .input-wrapper { position: relative; }
        .input-wrapper input { 
            width: 100%; padding: 14px 40px 14px 16px; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
        }
        .input-wrapper i { position: absolute; right: 15px; top: 15px; color: var(--text-dim); }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-pay { 
            width: 100%; padding: 15px; background: var(--primary-purple);
            border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;
            transition: 0.3s; margin-top: 10px;
        }
        .btn-pay:hover { background: #7644d6; }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="checkout-container">
        <div class="order-summary">
            <h2><i class="fa-solid fa-box-open"></i> Sipariş Özeti</h2>
            <div class="cart-items-list" id="checkout-cart-items">
                </div>
            <div class="total-price-box">
                <span>Hesaplanan Tutar</span>
                <span id="checkout-total-price">0.00 ₺</span>
            </div>
        </div>

        <div class="payment-form-container">
            <h2>Güvenli Ödeme Geçidi</h2>
            <div class="izco-badge"><i class="fa-solid fa-shield-halved"></i> iZCO Secure API Koruması Aktif</div>
            
            <form id="payment-form" onsubmit="handlePayment(event)">
                <div class="form-group">
                    <label for="card-holder">Kart Sahibinin Adı Soyadı</label>
                    <div class="input-wrapper">
                        <input type="text" id="card-holder" class="form-control" placeholder="Ahmet Yılmaz" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="card-number">Kart Numarası</label>
                    <div class="input-wrapper">
                        <input type="text" id="card-number" class="form-control" placeholder="4444 5555 6666 7777" maxlength="19" required>
                        <i class="fa-solid fa-credit-card"></i>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="card-expiry">Son Kullanma (AA/YY)</label>
                        <div class="input-wrapper">
                            <input type="text" id="card-expiry" class="form-control" placeholder="12/28" maxlength="5" required>
                            <i class="fa-solid fa-calendar-days"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="card-cvv">Güvenlik Kodu (CVV)</label>
                        <div class="input-wrapper">
                            <input type="password" id="card-cvv" class="form-control" placeholder="***" maxlength="3" required>
                            <i class="fa-solid fa-lock"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-pay" id="pay-btn">
                    <i class="fa-solid fa-circle-check"></i> Ödemeyi Tamamla
                </button>
            </form>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:5000"; 
        
        let cart = [];
        let user = null;

        document.addEventListener("DOMContentLoaded", function() {
            user = JSON.parse(localStorage.getItem("user"));
            cart = JSON.parse(localStorage.getItem("cart")) || [];

            if (!user || !user.email) {
                alert("Ödeme yapabilmek için önce giriş yapmalısınız!");
                window.location.href = "{{ url_for('login') }}";
                return;
            }

            if (cart.length === 0) {
                alert("Sepetiniz boş! Ödeme sayfasına erişilemez.");
                window.location.href = "{{ url_for('index') }}";
                return;
            }

            const cartContainer = document.getElementById("checkout-cart-items");
            let total = 0;
            cartContainer.innerHTML = "";

            cart.forEach(item => {
                let itemName = item.urunAdi || "Orixa Dijital Varlık";
                let cleanPrice = parseFloat(item.fiyat) || 0;
                let itemId = item.id || "0";

                total += cleanPrice;
                
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${itemName}</h4>
                            <p style="font-size:0.8rem; color: var(--text-dim)">ID: #00${itemId}</p>
                        </div>
                        <div class="cart-item-price">${cleanPrice === 0 ? 'Ücretsiz' : cleanPrice.toFixed(2) + ' ₺'}</div>
                    </div>
                `;
            });

            document.getElementById("checkout-total-price").innerText = `${total.toFixed(2)} ₺`;
        });

        async function handlePayment(event) {
            event.preventDefault();
            
            const payBtn = document.getElementById("pay-btn");
            payBtn.innerText = "İşlem Doğrulanıyor...";
            payBtn.disabled = true;

            const cleanCardNumber = document.getElementById("card-number").value.replace(/\s+/g, '');

            const paymentData = {
                email: user.email,
                cart: cart,
                cardHolder: document.getElementById("card-holder").value,
                cardNumber: cleanCardNumber
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/checkout/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentData)
                });
                
                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    localStorage.removeItem("cart");
                    window.location.href = "{{ url_for('index') }}";
                } else {
                    alert("Ödeme Hatası: " + data.error);
                    payBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Ödemeyi Tamamla';
                    payBtn.disabled = false;
                }
            } catch (err) {
                alert("Sistem hatası: Backend ağ geçidine bağlanılamadı.");
                payBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Ödemeyi Tamamla';
                payBtn.disabled = false;
            }
        }

        document.getElementById("card-number").addEventListener("input", function(e) {
            this.value = this.value.replace(/\s+/g, '').replace(/(\d{4})/g, '$1 ').trim();
        });
    </script>
</body>
</html>
