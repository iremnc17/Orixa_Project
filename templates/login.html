<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orixa | Giriş Yap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body class="login-page-body">
    <div class="background-overlay"></div>

    <div class="login-container">
        <header>
            <h1 class="logo">ORIXA<span>.</span></h1>
            <p class="tagline">Kod, Tasarım ve Rehberiniz</p>
        </header>

        <main class="hero">
            <div class="auth-card">
                <h2>Giriş Yap</h2>
                <p>Orixa dünyasına adım atın.</p>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" required placeholder="Kullanıcı Adı">
                    </div>
                    <div class="input-group">
                        <input type="password" required placeholder="Şifre">
                    </div>
                    <button type="submit" class="btn-glow">Giriş Yap</button>
                </form>
                <div class="footer-links">
                    <a href="{{ url_for('register') }}">Hesap Oluştur</a> • <a href="{{ url_for('index') }}">Vitrini Gez</a>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
