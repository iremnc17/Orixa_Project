<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orixa - Yönetici Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --primary-purple: #8957e5;
            --neon-blue: #00d4ff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #333333;
            --input-bg: #1a1a1a;
            --hero-bg: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #050505 70%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: var(--hero-bg);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.3s ease, background-color 0.3s ease;
        }

        .sidebar { width: 260px; background-color: var(--card-bg); padding: 2rem 1.5rem; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); position: relative; z-index: 2; }
        .sidebar h2 { color: var(--text-main); font-size: 1.5rem; font-weight: 700; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 10px; letter-spacing: -1px; }
        .sidebar h2 i { color: var(--neon-blue); }
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-menu li a { color: var(--text-dim); text-decoration: none; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; border: 1px solid transparent; transition: all 0.3s ease; }
        .sidebar-menu li a.active { background-color: rgba(137, 87, 229, 0.15); color: var(--neon-blue) !important; border-color: rgba(0, 212, 255, 0.3); font-weight: 600; }
        .main-content { flex: 1; padding: 2.5rem; overflow-y: auto; position: relative; z-index: 2; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.2rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .card { background-color: var(--card-bg); padding: 1.8rem; border-radius: 16px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; transition: all 0.4s; }
        .table-container { background-color: var(--card-bg); padding: 2rem; border-radius: 16px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); }
        .btn-transfer { background: var(--primary-purple); color: #ffffff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fa-solid fa-shield-halved"></i> Orixa Admin</h2>
        <ul class="sidebar-menu">
            <li><a href="/admin" class="active"><i class="fa-solid fa-chart-line"></i> Panel Özeti</a></li>
            <li><a href="/odeme"><i class="fa-solid fa-credit-card"></i> Ödeme Test Alanı</a></li>
            <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Yönetim Kontrol Merkezi</h1>
            <div id="admin-info" style="color: var(--neon-blue); font-weight: 500;"></div>
        </div>

        <div class="dashboard-grid">
            <div class="card wallet">
                <div class="card-info">
                    <h3>Güvenli Havuz Cüzdanı</h3>
                    <p id="wallet-balance">0.00 ₺</p>
                    <button class="btn-transfer" id="transfer-btn" onclick="triggerTransfer()">
                        <i class="fa-solid fa-building-columns"></i> Bankama Aktar
                    </button>
                </div>
                <div class="card-icon"><i class="fa-solid fa-wallet"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3>Banka Transfer Durumu</h3>
                    <p id="transfer-status" style="font-size: 1.1rem; margin-top: 8px; color: var(--neon-blue);">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div class="table-container">
            <h2>Ürün Satış ve Takip Listesi</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Ürün Adı</th><th>Kategori</th><th>Fiyat</th><th>Durum</th></tr>
                </thead>
                <tbody id="admin-product-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        let user = null;
        document.addEventListener("DOMContentLoaded", function() {
            user = JSON.parse(localStorage.getItem("user"));
            if (!user || !user.email) { blockAccess(); return; }

            fetch('/api/admin/dashboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, role: user.role || 'user' })
            })
            .then(res => res.ok ? res.json() : blockAccess())
            .then(data => {
                if (data) {
                    document.body.style.opacity = "1";
                    document.getElementById("admin-info").innerText = `Yönetici: ${user.username || user.email}`;
                    document.getElementById("wallet-balance").innerText = `${data.cuzdan_bakiye.toFixed(2)} ₺`;
                    document.getElementById("transfer-status").innerText = data.banka_aktarim_durumu;
                    const tableBody = document.getElementById("admin-product-table");
                    tableBody.innerHTML = data.products.map(prod => `
                        <tr><td>#00${prod.id}</td><td><strong>${prod.name}</strong></td><td>${prod.category}</td><td>${prod.price.toFixed(2)} ₺</td><td><span style="color: var(--neon-blue);"><i class="fa-solid fa-circle-check"></i> Aktif</span></td></tr>
                    `).join('');
                }
            }).catch(() => blockAccess());
        });

        function blockAccess() {
            alert("YETKİSİZ ERİŞİM!");
            window.location.href = "/"; 
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "/";
        }

        // Transfer fonksiyonun aynı kalabilir...
    </script>
</body>
</html>
